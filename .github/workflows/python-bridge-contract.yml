# Source: GitHub's documented Python CI recipe:
# https://docs.github.com/en/actions/tutorials/build-and-test-code/python
# Validation boundary: this checks Python bridge contracts, NOT native Unreal behavior.
name: Python bridge contract

on:
  push:
    branches:
      - review/avoid-invalid-socket-probe-20261121
  workflow_dispatch:

# Avoid duplicate push+PR runs, and discard obsolete tests on older commits.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: python-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned version used by Microsoft's calculator repository:
      # https://github.com/microsoft/calculator/blob/main/.github/workflows/action-ci.yml
      - name: Set up Microsoft Visual C++ compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install actual MCP server dependencies
        run: python -m pip install -e ./Python
      - name: Check syntax of bridge and test
        run: python -m compileall -q Python tests
      - name: Run isolated socket contract tests
        run: python -m unittest discover -s tests -p 'test_unreal_bridge*.py' -v
      - name: Compile and execute portable native framing tests
        run: python -m unittest discover -s tests -p 'test_native_line_framing_compiled.py' -v
      - name: Execute production Python against compiled C++ TCP stand-in
        run: python -m unittest discover -s tests -p 'test_cpp_tcp_interop.py' -v
      - name: Check actual native C++ / Python protocol agreement
        run: python -m unittest discover -s tests -p 'test_native_protocol_contract.py' -v
      - name: Prevent silent failure results in registered MCP tools
        run: python -m unittest discover -s tests -p 'test_mcp_registration_guard.py' -v
      - name: Run MCP entrypoint and full TCP round-trip tests
        run: python -m unittest discover -s tests -p 'test_mcp*.py' -v
